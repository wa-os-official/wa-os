name: Calculate SHA-256

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "wa-os.protocol.json"
      - "wa-os.manifest.json"
      - "wa_os_runtime.py"
      - "wa-os.protocol.v1.6-draft.json"
      - "wa-os.manifest.v1.6-draft.json"
      - "wa_os_observatory.py"
      - "wa_os_principles.py"
      - ".github/workflows/calculate-sha256.yml"

permissions:
  contents: read

jobs:
  calculate-sha256:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show repository files
        shell: bash
        run: |
          echo "Files in repository root:"
          ls -la

      - name: Verify target files exist
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "wa-os.protocol.json"
            "wa-os.manifest.json"
            "wa_os_runtime.py"
          )

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              exit 1
            fi
          done

      - name: Calculate SHA-256 checksums
        id: checksums
        shell: bash
        run: |
          set -euo pipefail

          protocol_sha256="$(sha256sum "wa-os.protocol.json" | awk '{print $1}')"
          manifest_sha256="$(sha256sum "wa-os.manifest.json" | awk '{print $1}')"
          runtime_sha256="$(sha256sum "wa_os_runtime.py" | awk '{print $1}')"

          echo "protocol_sha256=$protocol_sha256" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "runtime_sha256=$runtime_sha256" >> "$GITHUB_OUTPUT"

          echo "$protocol_sha256  wa-os.protocol.json" > SHA256SUMS.txt
          echo "$manifest_sha256  wa-os.manifest.json" >> SHA256SUMS.txt
          echo "$runtime_sha256  wa_os_runtime.py" >> SHA256SUMS.txt

      - name: Write results to workflow summary
        shell: bash
        run: |
          echo "## WA-OS SHA-256 Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| wa-os.protocol.json | ${{ steps.checksums.outputs.protocol_sha256 }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| wa-os.manifest.json | ${{ steps.checksums.outputs.manifest_sha256 }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| wa_os_runtime.py | ${{ steps.checksums.outputs.runtime_sha256 }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checksum file
        uses: actions/upload-artifact@v4
        with:
          name: wa-os-sha256-checksums
          path: SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # v1.6-draft candidate files.
      # These steps only calculate and report SHA-256 values.
      # They do not modify LATEST.v1.6-draft.json or activate v1.6.
      - name: Verify v1.6-draft target files exist
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "wa-os.protocol.v1.6-draft.json"
            "wa-os.manifest.v1.6-draft.json"
            "wa_os_observatory.py"
            "wa_os_principles.py"
          )

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              exit 1
            fi
          done

      - name: Calculate v1.6-draft SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "wa-os.protocol.v1.6-draft.json" \
            "wa-os.manifest.v1.6-draft.json" \
            "wa_os_observatory.py" \
            "wa_os_principles.py" \
            > SHA256SUMS-v1.6-draft.txt

          cat SHA256SUMS-v1.6-draft.txt

          {
            echo ""
            echo "## WA-OS v1.6-draft SHA-256 Results (candidate, not yet activated)"
            echo ""
            echo "| File | SHA-256 |"
            echo "|---|---|"
            while read -r hash file; do
              echo "| $file | $hash |"
            done < SHA256SUMS-v1.6-draft.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload v1.6-draft checksum file
        uses: actions/upload-artifact@v4
        with:
          name: wa-os-v1.6-draft-sha256-checksums
          path: SHA256SUMS-v1.6-draft.txt
          if-no-files-found: error
          retention-days: 30
